[build]
  command = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable && source $HOME/.cargo/env && cargo install dioxus-cli --locked && dx build --release && printf '/assets/*  /assets/:splat  200\n/*.js  /:splat  200\n/*.wasm  /:splat  200\n/*  /index.html  200\n' > target/dx/telcoin-explorer/release/web/public/_redirects"
  publish = "target/dx/telcoin-explorer/release/web/public"

[build.environment]
  RUST_LOG = "info"

# main.css is referenced by a static path (not run through Dioxus's asset
# hashing like the JS/WASM bundles), so without this it can get stuck in
# browser/CDN caches across deploys -- force revalidation on every load so
# CSS changes always reach people without a manual cache clear.
[[headers]]
  for = "/assets/main.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
