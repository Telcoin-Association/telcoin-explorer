name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Cache dx
        id: dxcache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-0.7.10-${{ runner.os }}

      - name: Install dx
        if: steps.dxcache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build
        run: dx build --release

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r target/dx/telcoin-explorer/release/web/public/. .vercel/output/static/
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
